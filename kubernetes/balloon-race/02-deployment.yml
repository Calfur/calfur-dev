apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: balloon-race
  labels:
    app: balloon-race

spec:
  replicas: 1
  selector:
    matchLabels:
      app: balloon-race
  template:
    metadata:
      labels:
        app: balloon-race
    spec:
      automountServiceAccountToken: false
      containers:
        - name: balloon-race
          image: ghcr.io/calfur/balloon-race:80078df65b8be442ae427799b3766bad967958e8
          ports:
            - name: web
              containerPort: 80
