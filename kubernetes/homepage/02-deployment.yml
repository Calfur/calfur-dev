apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: homepage
  labels:
    app: homepage

spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      automountServiceAccountToken: false
      containers:
        - name: homepage
          image: ghcr.io/calfur/homepage:ce9d5989d4e115c9d42506049b5810f5df565e6b
          ports:
            - name: web
              containerPort: 3000 