apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: q-swiper
  labels:
    app: q-swiper

spec:
  replicas: 1
  selector:
    matchLabels:
      app: q-swiper
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: calfur-dev
        app: q-swiper
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: q-swiper
          image: ghcr.io/q-swiper/map-generator:e4e7d910d79db1d1825707d0b28b7caeb5b05f67
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              # Existing Nginx configurations listen on port 80.
              add: [NET_BIND_SERVICE]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 128Mi
              ephemeral-storage: 1Gi
          command: [nginx]
          args: ["-g", "daemon off;"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          ports:
            - name: web
              containerPort: 80
      imagePullSecrets:
        - name: ghcr-secret
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 128Mi
        - name: nginx-run
          emptyDir:
            sizeLimit: 16Mi
