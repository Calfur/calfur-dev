apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: watermark-webapp
  labels:
    app: watermark-webapp

spec:
  replicas: 1
  selector:
    matchLabels:
      app: watermark-webapp
  template:
    metadata:
      labels:
        app: watermark-webapp
    spec:
      automountServiceAccountToken: false
      containers:
        - name: watermark-webapp
          image: ghcr.io/thirty-degrees/watermark-webapp:816f011924c74f3fe8f55244d8ced59e56c37bf1
          imagePullPolicy: Always
          ports:
            - name: web
              containerPort: 3000 
      imagePullSecrets:
        - name: ghcr-secret
