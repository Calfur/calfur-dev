apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: watermark-webapp
  labels:
    app: watermark-webapp

spec:
  replicas: 1
  selector:
    matchLabels:
      app: watermark-webapp
  template:
    metadata:
      labels:
        app: watermark-webapp
    spec:
      automountServiceAccountToken: false
      containers:
        - name: watermark-webapp
          image: ghcr.io/thirty-degrees/watermark-webapp:0b9b33f0425bc312bdaf1d6156c496924cc65d36
          imagePullPolicy: Always
          ports:
            - name: web
              containerPort: 3000 
      imagePullSecrets:
        - name: ghcr-secret
