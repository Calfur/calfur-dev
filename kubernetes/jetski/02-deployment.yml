apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: jetski
  labels:
    app: jetski

spec:
  replicas: 1
  selector:
    matchLabels:
      app: jetski
  template:
    metadata:
      labels:
        app: jetski
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jetski
          image: ghcr.io/calfur/jetski:4c21933cde673c3a89d764838f7857a3435e2199
          ports:
            - name: web
              containerPort: 3000
