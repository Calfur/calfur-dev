apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: jetski
  labels:
    app: jetski

spec:
  replicas: 1
  selector:
    matchLabels:
      app: jetski
  template:
    metadata:
      labels:
        app: jetski
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jetski
          image: ghcr.io/calfur/jetski:8bc59b35fd3eeb539751cc4b03968b8c61dd9424
          ports:
            - name: web
              containerPort: 3000
