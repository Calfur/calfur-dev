apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: party-battle-frontend
  labels:
    app: party-battle-frontend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: party-battle-frontend
      app.kubernetes.io/part-of: party-battle
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: calfur-dev
        app: party-battle-frontend
        app.kubernetes.io/part-of: party-battle
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: party-battle-frontend
          image: ghcr.io/thirty-degrees/frontend-party-battle-web:63cb0eee03283f0728b09516eaa027e6a118f696
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              # Existing Nginx configurations listen on port 80.
              add: [NET_BIND_SERVICE]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 128Mi
              ephemeral-storage: 1Gi
          command: [nginx]
          args: ["-g", "daemon off;"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          ports:
            - name: web
              containerPort: 80
      imagePullSecrets:
        - name: ghcr-secret
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 128Mi
        - name: nginx-run
          emptyDir:
            sizeLimit: 16Mi
