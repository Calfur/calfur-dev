apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: party-battle-frontend
  labels:
    app: party-battle-frontend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: party-battle-frontend
  template:
    metadata:
      labels:
        app: party-battle-frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: party-battle-frontend
          image: ghcr.io/thirty-degrees/frontend-party-battle-web:a54d07ffa0bc9aedb39427123da6067b84951727-39741548604-1
          ports:
            - name: web
              containerPort: 80
      imagePullSecrets:
        - name: ghcr-secret
