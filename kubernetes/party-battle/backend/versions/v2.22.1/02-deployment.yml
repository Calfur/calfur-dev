apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: party-battle-backend-v2-22-1
  labels:
    app: party-battle-backend-v2-22-1

spec:
  replicas: 1
  selector:
    matchLabels:
      app: party-battle-backend-v2-22-1
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: calfur-dev
        app: party-battle-backend-v2-22-1
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: party-battle-backend
          image: ghcr.io/thirty-degrees/backend-party-battle:63cb0eee03283f0728b09516eaa027e6a118f696
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: api
              containerPort: 2567
      imagePullSecrets:
        - name: ghcr-secret
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
