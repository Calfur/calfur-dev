apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: party-battle-backend-v2-22-1
  labels:
    app: party-battle-backend-v2-22-1

spec:
  replicas: 1
  selector:
    matchLabels:
      app: party-battle-backend-v2-22-1
  template:
    metadata:
      labels:
        app: party-battle-backend-v2-22-1
    spec:
      automountServiceAccountToken: false
      containers:
        - name: party-battle-backend
          image: ghcr.io/thirty-degrees/backend-party-battle:a54d07ffa0bc9aedb39427123da6067b84951727-39741548604-1
          ports:
            - name: api
              containerPort: 2567
      imagePullSecrets:
        - name: ghcr-secret
