apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: party-battle-backend-catchall
  labels:
    app: party-battle-backend-catchall

spec:
  replicas: 1
  selector:
    matchLabels:
      app: party-battle-backend-catchall
  template:
    metadata:
      labels:
        app: party-battle-backend-catchall
    spec:
      automountServiceAccountToken: false
      containers:
        - name: party-battle-backend
          image: ghcr.io/thirty-degrees/api-version-unsupported-colyseus:0cde7761e79b08ebe6d98ee6375ad4913a140c90
          ports:
            - name: api
              containerPort: 80
      imagePullSecrets:
        - name: ghcr-secret
