apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: star-wars-bild-countdown
  labels:
    app: star-wars-bild-countdown

spec:
  replicas: 1
  selector:
    matchLabels:
      app: star-wars-bild-countdown
  template:
    metadata:
      labels:
        app: star-wars-bild-countdown
    spec:
      automountServiceAccountToken: false
      containers:
        - name: star-wars-bild-countdown
          image: ghcr.io/calfur/star-wars-bild-countdown:a334a2d48916a1a362e47004dd237d5f13c68548
          ports:
            - name: web
              containerPort: 80
