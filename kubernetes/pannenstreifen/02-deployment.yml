apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: pannenstreifen-website
  labels:
    app: pannenstreifen-website

spec:
  replicas: 1
  selector:
    matchLabels:
      app: pannenstreifen-website
  template:
    metadata:
      labels:
        app: pannenstreifen-website
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pannenstreifen-website
          image: ghcr.io/calfur/pannenstreifen-website:616891e44706b5d77438535ee52881462ab737be
          ports:
            - name: web
              containerPort: 80
