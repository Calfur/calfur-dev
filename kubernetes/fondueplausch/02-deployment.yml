apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: fondueplausch
  labels:
    app: fondueplausch

spec:
  replicas: 1
  selector:
    matchLabels:
      app: fondueplausch
  template:
    metadata:
      labels:
        app: fondueplausch
    spec:
      automountServiceAccountToken: false
      containers:
        - name: fondueplausch
          image: ghcr.io/jubla-nz/fondue-plausch:63ee36f39a50745a9d7a1eb054bd79131f2bc960
          ports:
            - name: web
              containerPort: 80
      imagePullSecrets:
        - name: ghcr-secret
