apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: fondueplausch
  labels:
    app: fondueplausch

spec:
  replicas: 1
  selector:
    matchLabels:
      app: fondueplausch
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: calfur-dev
        app: fondueplausch
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fondueplausch
          image: ghcr.io/jubla-nz/fondue-plausch:5265ca4d79f0c8d3200896a08fabcc3a6a36bd13
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              # Existing Nginx configurations listen on port 80.
              add: [NET_BIND_SERVICE]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 128Mi
              ephemeral-storage: 1Gi
          command: [nginx]
          args: ["-g", "daemon off;"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          ports:
            - name: web
              containerPort: 80
      imagePullSecrets:
        - name: ghcr-secret
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 128Mi
        - name: nginx-run
          emptyDir:
            sizeLimit: 16Mi
