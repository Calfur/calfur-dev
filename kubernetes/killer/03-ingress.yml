apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  namespace: default
  name: ingressroute-killer

spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`killer.jubla-nz.ch`)
      kind: Rule
      middlewares:
        - name: hsts
      services:
        - name: killer
          port: 80
  tls:
    certResolver: myresolver
