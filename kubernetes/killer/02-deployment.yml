apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: killer
  labels:
    app: killer

spec:
  replicas: 1
  selector:
    matchLabels:
      app: killer
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: calfur-dev
        app: killer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: killer
          image: ghcr.io/calfur/killer:baed0632105945e40165e9d41fb9e48427aff0c6
          securityContext:
            allowPrivilegeEscalation: false
            # The current image writes game.json in /app.
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: web
              containerPort: 5000
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
