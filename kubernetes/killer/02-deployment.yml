apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: killer
  labels:
    app: killer

spec:
  replicas: 1
  selector:
    matchLabels:
      app: killer
  template:
    metadata:
      labels:
        app: killer
    spec:
      automountServiceAccountToken: false
      containers:
        - name: killer
          image: ghcr.io/calfur/killer:baed0632105945e40165e9d41fb9e48427aff0c6
          ports:
            - name: web
              containerPort: 5000
