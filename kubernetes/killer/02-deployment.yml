apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: killer
  labels:
    app: killer

spec:
  replicas: 1
  selector:
    matchLabels:
      app: killer
  template:
    metadata:
      labels:
        app: killer
    spec:
      automountServiceAccountToken: false
      containers:
        - name: killer
          image: ghcr.io/calfur/killer:f2904a41ebe390e5f34d71c754cd2842d2753a84
          ports:
            - name: web
              containerPort: 5000
