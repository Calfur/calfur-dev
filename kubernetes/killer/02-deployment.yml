apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: killer
  labels:
    app: killer

spec:
  replicas: 1
  selector:
    matchLabels:
      app: killer
  template:
    metadata:
      labels:
        app: killer
    spec:
      automountServiceAccountToken: false
      containers:
        - name: killer
          image: ghcr.io/calfur/killer:00983b92f4480d7a869ed84dc93e822d684d7af9
          ports:
            - name: web
              containerPort: 5000
