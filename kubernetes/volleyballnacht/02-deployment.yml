apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: volleyballnacht
  labels:
    app: volleyballnacht

spec:
  replicas: 1
  selector:
    matchLabels:
      app: volleyballnacht
  template:
    metadata:
      labels:
        app: volleyballnacht
    spec:
      automountServiceAccountToken: false
      containers:
        - name: volleyballnacht
          image: ghcr.io/jubla-nz/volleyball-nacht:0b4cf15db6dc2837928cd9801784cec5460a1b5f
          ports:
            - name: web
              containerPort: 80
      imagePullSecrets:
        - name: ghcr-secret
