apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: volleyballnacht
  labels:
    app: volleyballnacht

spec:
  replicas: 1
  selector:
    matchLabels:
      app: volleyballnacht
  template:
    metadata:
      labels:
        app: volleyballnacht
    spec:
      automountServiceAccountToken: false
      containers:
        - name: volleyballnacht
          image: ghcr.io/jubla-nz/volleyball-nacht:80ad85db7abe70f4f852b93ed05b679bd9b4c37c
          ports:
            - name: web
              containerPort: 80
      imagePullSecrets:
        - name: ghcr-secret
