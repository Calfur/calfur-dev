apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: volleyballnacht
  labels:
    app: volleyballnacht

spec:
  replicas: 1
  selector:
    matchLabels:
      app: volleyballnacht
  template:
    metadata:
      labels:
        app: volleyballnacht
    spec:
      automountServiceAccountToken: false
      containers:
        - name: volleyballnacht
          image: ghcr.io/jubla-nz/volleyball-nacht:3336ae7f93a5721d042a6e38576a6b85f4997dde
          ports:
            - name: web
              containerPort: 80
      imagePullSecrets:
        - name: ghcr-secret
