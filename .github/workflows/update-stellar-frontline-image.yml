name: Update Stellar Frontline Image

on:
  repository_dispatch:
    types: [new-stellar-frontline-image]

jobs:
  call-template:
    uses: ./.github/workflows/update-image-template.yml
    with:
      image_version: ${{ github.event.client_payload.image_version }}
      image_name: ghcr.io/calfur/stellar-frontline
      file_path: ./kubernetes/stellar-frontline/02-deployment.yml
      trigger_deploy: true
