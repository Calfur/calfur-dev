name: Update Arctic Kälte Homepage Image

on:
  repository_dispatch:
    types: [new-arctic-kaelte-homepage-image]

jobs:
  call-template:
    uses: ./.github/workflows/update-image-template.yml
    with:
      image_version: ${{ github.event.client_payload.image_version }}
      image_name: ghcr.io/arctic-kaelte/homepage
      file_path: ./kubernetes/arctic-kaelte-homepage/02-deployment.yml
      trigger_deploy: true
