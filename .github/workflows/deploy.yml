name: Deploy to Kubernetes (calfur-001)

on:
  push:
    branches:
      - master
  workflow_dispatch:
  repository_dispatch:
    types: [deploy]

env:
  DEPLOY_PATH: /opt/GitHubAction/

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: calfur-001
    concurrency: calfur-001

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Copy Kubernetes manifests to the server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_IP }}
        port: ${{ secrets.SERVER_SSH_PORT }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
        source: "./kubernetes/*"
        target: "${{ env.DEPLOY_PATH }}"

    - name: Apply Kubernetes manifests on the server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        port: ${{ secrets.SERVER_SSH_PORT }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
        script: |
          set -eu

          echo "Creating Docker registry secret"
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GH_PAT_PACKAGES_READ }} \
            --docker-email=${{ secrets.EMAIL }} \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Creating Traefik email secret"
          kubectl create secret generic traefik-acme-email \
            --from-literal=email=${{ secrets.EMAIL }} \
            --dry-run=client -o yaml | kubectl apply -f -
            
          echo "Creating Grafana admin credentials secret"
          kubectl create secret generic grafana-admin-credentials \
            --from-literal=password=${{ secrets.GRAFANA_ADMIN_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Creating Stellar Frontline Telegram secret"
          kubectl create secret generic stellar-frontline-telegram \
            --from-literal=bot-token=${{ secrets.STELLAR_FRONTLINE_TELEGRAM_BOT_TOKEN }} \
            --from-literal=chat-id=${{ secrets.STELLAR_FRONTLINE_TELEGRAM_CHAT_ID }} \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Applying Traefik prerequisites"
          kubectl apply -k ${{ env.DEPLOY_PATH }}/kubernetes/traefik
          kubectl -n default rollout status deployment/traefik --timeout=120s

          echo "Applying the complete repository inventory"
          kubectl -n default apply -k ${{ env.DEPLOY_PATH }}/kubernetes
          kubectl -n default rollout status deployment -l calfur.dev/managed-by=calfur-dev --timeout=180s

          echo "Pruning removed repository resources after workloads are healthy"
          kubectl -n default apply -k ${{ env.DEPLOY_PATH }}/kubernetes \
            --prune -l calfur.dev/managed-by=calfur-dev \
            --prune-allowlist=apps/v1/Deployment \
            --prune-allowlist=core/v1/Service \
            --prune-allowlist=traefik.io/v1alpha1/IngressRoute \
            --prune-allowlist=traefik.io/v1alpha1/Middleware

          echo "Cleaning up"
          rm -rf ${{ env.DEPLOY_PATH }}
